<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Accueil</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
    }

    h1 {
      margin-bottom: 40px;
    }

    .menu {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    a {
      text-decoration: none;
    }

    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 10px;
      width: 200px;
      cursor: pointer;
      transition: 0.3s;
    }

    .card:hover {
      background: #333;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<h1>🎬 Menu principal</h1>

<div class="menu">
  <a href="videos.html">
    <div class="card">🔍 Vidéos</div>
  </a>

  <a href="playlists.html">
    <div class="card">📺 Playlists</div>
  </a>

  <a href="channels.html">
    <div class="card">📡 Chaînes</div>
  </a>
</div>

</body>
</html>
