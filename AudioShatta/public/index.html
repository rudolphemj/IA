<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Accueil</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 50px;
    }

    h1 {
      margin-bottom: 40px;
    }

    .menu {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    a {
      text-decoration: none;
    }

    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 10px;
      width: 200px;
      cursor: pointer;
      transition: 0.3s;
    }

    .card:hover {
      background: #333;
      transform: scale(1.05);
    }

#fileList {
  list-style: none;
  padding: 0;
}

#fileList li {
  background: #1e1e1e;
  margin: 10px auto;
  padding: 10px;
  border-radius: 8px;
  width: 50%;
}

#fileList a {
  color: #4da6ff;
}


	
  </style>
</head>

<body>

<h1>🎬 Menu principal</h1>

<div class="menu">
  <a href="videos.html">
    <div class="card">🔍 Vidéos</div>
  </a>

  <a href="playlists.html">
    <div class="card">📺 Playlists</div>
  </a>

  <a href="channels.html">
    <div class="card">📡 Chaînes</div>
  </a>

  <a href="download.html">
    <div class="card">📥 Télécharger</div>
  </a>
</div>

<h2>📁 Fichiers téléchargés</h2>
<ul id="fileList"></ul>

<script>
fetch("/api/files")
  .then(res => res.json())
  .then(files => {
    const list = document.getElementById("fileList");

    files.forEach(file => {
      const li = document.createElement("li");


li.innerHTML = `
  <a href="/files/${file.name}" target="_blank">
    ${file.name}
  </a>
  (${Math.round(file.size / 1024)} KB)
`;


      list.appendChild(li);
    });
  })
  .catch(err => console.error(err));
</script>

</body>
</html>
