<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Clips Shatta récents</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    #videos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .video {
      background: #1e1e1e;
      border-radius: 10px;
      margin: 10px;
      padding: 15px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .video img {
      width: 100%;
      border-radius: 8px;
    }

    .video h3 {
      font-size: 16px;
      margin: 10px 0;
    }

    .video p {
      margin: 5px 0;
      font-size: 13px;
      color: #ccc;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .watch {
      background: #ff0000;
      color: white;
    }

    .download {
      background: #00d4ff;
      color: black;
    }

    .error {
      text-align: center;
      color: red;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>🔥 Nouveaux clips Shatta (60 jours)</h1>

<div id="videos"></div>
<div id="error" class="error"></div>

<input id="searchInput" type="text" placeholder="Recherche une vidéo...">

<label style="margin-left:10px;">
  <input type="checkbox" id="officialOnly">
  🎬 Clip officiel
</label>



<button onclick="searchVideos()"> 🔍 Rechercher</button>


<div id="results"></div>
<br>
<a href="index.html" style="color:white;">⬅ Retour</a>
<script>

// propose une recherche
async function searchVideos() {


  try {
    let query = document.getElementById("searchInput").value;

    if (!query) {
      alert("Veuillez entrer un texte");
      return;
    }


 // ✅ vérifier si la case est cochée
    const officialOnly = document.getElementById("officialOnly").checked;

    if (officialOnly) {
      query += ' (clip officiel)';
	     // "clip officiel";
    }

    const response = await fetch("/search?type=playlist&q=" + encodeURIComponent(query));
    const data = await response.json();

    displayResults(data.items);

  } catch (err) {
    console.error("Erreur searchVideos:", err);
  }
}


//Charge le resultat
async function loadVideos(query) {
  try {
    const res = await fetch("/search?q=" + encodeURIComponent(query));
    const data = await res.json();

    displayResults(data.items);

  } catch (error) {
    console.error(error);
  }
}

// affichage du résultat
function displayResults(videos) {
  const container = document.getElementById("videos");
  container.innerHTML = "";

  videos.forEach(video => {
    if (!video.id?.playlistId) return;

    const title = video.snippet.title;
    const channel = video.snippet.channelTitle;
    const date = new Date(video.snippet.publishedAt).toLocaleDateString();
    const playlistId = video.id.playlistId;
    const thumbnail = video.snippet.thumbnails.medium.url;

    const div = document.createElement("div");
    div.className = "video";

    div.innerHTML = `
      <img src="${thumbnail}" />
      <h3>${title}</h3>
      <p>Chaîne: ${channel}</p>
      <p>Date: ${date}</p>
      <div class="buttons">
        <button class="watch" onclick="openPlaylist('${playlistId}')">
          ▶️ Voir playlist
        </button>
      </div>
    `;

    container.appendChild(div);
  });
}

//Overture des listes
function openPlaylist(id) {
  window.open(`https://www.youtube.com/playlist?list=${id}`, "_blank");
}


// ✅ Téléchargement sans quitter la page
function downloadVideo(videoId, button) {
  button.innerText = "⏳...";

  const iframe = document.createElement("iframe");
  iframe.style.display = "none";
  iframe.src = "/download/" + videoId;

  document.body.appendChild(iframe);

  setTimeout(() => {
    button.innerText = "✅";
  }, 2000);
}

// Regarder la vidéo

function openVideo(videoId) {
  const url = `https://www.youtube.com/watch?v=${videoId}`;
  window.open(url, "_blank");
}


// ✅ déclenche la recherche avec la touche Entrée
document.getElementById("searchInput")
    .addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        searchVideos();
      }
    });


</script>

</body>
</html>
